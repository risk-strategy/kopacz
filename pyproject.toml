[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kopacz"
version = "3.0.0"
requires-python = ">=3.10"
dependencies = [
    "pycryptodomex>=3.20",
    "cryptography>=41.0",
    "lz4>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
kopacz-relay = "kopacz.__main__:main"
kopacz-client = "kopacz.cli:main"

[project.optional-dependencies]
server = ["dnslib>=0.9"]
proxy = ["PySocks>=1.7"]
test = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]
deploy = ["pyinfra>=3.0"]

[tool.setuptools.packages.find]
include = ["kopacz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
